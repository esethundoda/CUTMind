name: cutmind
description: "CUTMind – ML-Driven Mental Wellness App for CUT Students"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.7

  # UI / Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0          # For SHAP-style bar charts & mood trend charts
  percent_indicator: ^4.2.3  # For wellness score ring
  lottie: ^3.1.2             # Calm illustrated animations (breathing, journal, goals)

  # Utilities
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  http: ^1.2.0               # OpenRouter AI calls

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/images/
    - assets/animations/
